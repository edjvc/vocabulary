name: Build and deploy vocabulary PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Snapshot core word list once (never replace)
        run: |
          python3 scripts/build_vocab.py
          if ! git diff --quiet -- data/core.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/core.json
            git commit -m 'Lock initial Lexifold TOEIC 4027-word snapshot'
            git push
          fi
      - name: Validate locked core
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/core.json', encoding='utf-8'))
          assert d['word_count'] == len(d['words']) == 4027
          assert len({w['word'].casefold() for w in d['words']}) == 4027
          print('Validated 4027 immutable core words')
          PY
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css app.js db.js sw.js manifest.webmanifest _site/
          cp -r assets data _site/
          echo '<meta http-equiv="refresh" content="0;url=./">' > _site/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
